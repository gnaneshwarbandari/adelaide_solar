<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .slideshow-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 450px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background: #1e293b;
    }

    .slide {
      display: none;
      width: 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Next & previous buttons */
    .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 12px 18px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      background-color: rgba(0,0,0,0.4);
      border-radius: 50%;
      user-select: none;
      border: none;
      transition: background-color 0.3s;
    }

    .prev:hover, .next:hover {
      background-color: rgba(0,0,0,0.8);
    }

    .prev { left: 16px; }
    .next { right: 16px; }

    /* Indicator Dots */
    .dots-container {
      text-align: center;
      margin-top: 15px;
    }

    .dot {
      cursor: pointer;
      height: 12px;
      width: 12px;
      margin: 0 4px;
      background-color: #475569;
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.3s;
    }

    .active, .dot:hover {
      background-color: #38bdf8;
    }

    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-size: 18px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h2>Google Drive Image Slideshow</h2>

  <div class="slideshow-container" id="slideshow">
    <div class="loader" id="loader">Loading images from Google Drive...</div>
  </div>

  <div class="dots-container" id="dots"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzB0xI_wyKPXr7rm1iKc9CW8dOyCm9FBo6TI6x4VE5vyJ3o1b6fs5BGKPmhWdAs-Is4/exec";
    let slideIndex = 0;
    let slides = [];
    let dots = [];
    let autoSlideTimer;

    async function initSlideshow() {
      try {
        const response = await fetch(SCRIPT_URL);
        const images = await response.json();

        if (!images || images.length === 0) {
          document.getElementById('loader').innerText = "No images found in folder.";
          return;
        }

        const slideshowContainer = document.getElementById('slideshow');
        const dotsContainer = document.getElementById('dots');
        slideshowContainer.innerHTML = ''; // Clear loader

        // Build Slides and Dots
        images.forEach((img, index) => {
          const slideDiv = document.createElement('div');
          slideDiv.className = 'slide';
          slideDiv.innerHTML = `<img src="${img.url}" alt="${img.name}" loading="lazy" />`;
          slideshowContainer.appendChild(slideDiv);

          const dotSpan = document.createElement('span');
          dotSpan.className = 'dot';
          dotSpan.onclick = () => currentSlide(index);
          dotsContainer.appendChild(dotSpan);
        });

        // Add Nav Buttons
        slideshowContainer.innerHTML += `
          <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
          <button class="next" onclick="changeSlide(1)">&#10095;</button>
        `;

        slides = document.getElementsByClassName("slide");
        dots = document.getElementsByClassName("dot");

        showSlide(slideIndex);
        startAutoSlide();

      } catch (err) {
        console.error("Error fetching images:", err);
        document.getElementById('loader').innerText = "Failed to load slideshow.";
      }
    }

    function showSlide(n) {
      if (slides.length === 0) return;

      if (n >= slides.length) { slideIndex = 0; }
      if (n < 0) { slideIndex = slides.length - 1; }

      for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
        dots[i].classList.remove("active");
      }

      slides[slideIndex].style.display = "block";
      dots[slideIndex].classList.add("active");
    }

    function changeSlide(n) {
      resetAutoSlide();
      showSlide(slideIndex += n);
    }

    function currentSlide(n) {
      resetAutoSlide();
      showSlide(slideIndex = n);
    }

    function startAutoSlide() {
      autoSlideTimer = setInterval(() => {
        showSlide(slideIndex += 1);
      }, 4000); // Transitions every 4 seconds
    }

    function resetAutoSlide() {
      clearInterval(autoSlideTimer);
      startAutoSlide();
    }

    // Run on load
    initSlideshow();
  </script>
</body>
</html>
